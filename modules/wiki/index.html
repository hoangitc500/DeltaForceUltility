<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cẩm Nang - Delta Force Utility</title>
  <link rel="stylesheet" href="../../core/theme.css">
  <script src="../../core/theme.js"></script>
  <style>
    .tabs { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; margin-bottom: 10px; }
    .tabs button {
      padding: 7px 2px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-dim);
      font-size: 12px;
      font-weight: 700;
      transition: 0.15s;
    }
    .tabs button:hover { color: var(--text); }
    .tabs button.active { border-color: var(--primary); background: var(--primary-soft); color: var(--primary); }

    .toolbar { display: flex; flex-direction: column; gap: 8px; padding: 10px; margin-bottom: 10px; }
    .search-wrap { position: relative; }
    .search-wrap svg { position: absolute; left: 10px; top: 50%; width: 15px; height: 15px; transform: translateY(-50%); color: var(--text-faint); pointer-events: none; }
    .search-wrap .input { padding-left: 32px; }
    .chips .chip small { margin-left: 4px; opacity: 0.6; font-weight: 500; }

    .info { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-faint); margin-bottom: 8px; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
    .grid.wide { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
    .card {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
      padding: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      text-align: left;
      transition: border-color 0.15s, transform 0.15s;
      animation: viewIn 0.2s ease;
    }
    .card:hover { border-color: var(--g); transform: translateY(-1px); }
    .card .pic {
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 5px;
      background: linear-gradient(180deg, color-mix(in srgb, var(--g) 22%, transparent), color-mix(in srgb, var(--g) 6%, transparent));
      border-bottom: 2px solid var(--g);
    }
    .card .pic img { max-width: 100%; max-height: 62px; object-fit: contain; }
    .grid.wide .card .pic { height: 120px; }
    .grid.wide .card .pic img { max-height: 116px; }
    .card .nm { font-size: 12.5px; font-weight: 700; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card .ln { font-size: 11px; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .more-wrap { display: flex; justify-content: center; padding: 12px 0 0; }
    .state-box { grid-column: 1 / -1; padding: 36px 12px; text-align: center; color: var(--text-dim); }
    .skeleton { height: 120px; border-radius: var(--radius); border: 1px solid var(--border); background: linear-gradient(90deg, var(--surface-2) 25%, var(--surface) 50%, var(--surface-2) 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
    @keyframes shimmer { to { background-position: -200% 0; } }

    /* ---- Chi tiết ---- */
    .d-hero {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 150px;
      margin: -4px 0 12px;
      border-radius: 8px;
      background: linear-gradient(180deg, color-mix(in srgb, var(--g) 25%, transparent), transparent);
      border-bottom: 2px solid var(--g);
    }
    .d-hero img { max-width: 100%; max-height: 140px; object-fit: contain; }
    .d-sub { font-size: 12px; color: var(--text-dim); margin: -2px 0 10px; }
    .d-desc { font-size: 13px; color: var(--text-dim); margin: 10px 0; }
    .kv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
    .kv div { padding: 6px 8px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; min-width: 0; }
    .kv dt { font-size: 10.5px; color: var(--text-faint); text-transform: uppercase; }
    .kv dd { margin: 0; font-weight: 700; overflow-wrap: anywhere; }
    .bars { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; margin: 10px 0; }
    .bar-row { font-size: 11px; color: var(--text-dim); }
    .bar-row .r { display: flex; justify-content: space-between; margin-bottom: 2px; }
    .bar-row b { color: var(--text); }
    .bar-row .bar { height: 4px; background: var(--input-bg); border-radius: 2px; overflow: hidden; }
    .bar-row .bar > div { height: 100%; background: var(--primary); }
    .d-sec { margin: 14px 0 6px; font-size: 12px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase; color: var(--text-dim); }
    .pill-list { display: flex; flex-wrap: wrap; gap: 4px; }
    .delta.up { color: var(--primary); }
    .delta.down { color: var(--error); }
    .skill { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--border); }
    .skill img { width: 40px; height: 40px; border-radius: 6px; background: var(--surface-2); }
    .skill b { display: block; font-size: 13px; }
    .skill small { display: block; font-size: 10.5px; color: var(--accent); text-transform: uppercase; }
    .skill p { margin: 2px 0 0; font-size: 12.5px; color: var(--text-dim); }
    .loc { display: flex; gap: 6px; align-items: baseline; padding: 4px 0; font-size: 13px; }
    .loc .badge { flex: none; }
  </style>
</head>

<body>
  <div class="view-container">
    <div class="view-header">
      <div class="title-group">
        <button class="back-btn" data-back></button>
        <h3 class="view-title">Cẩm Nang<small>Tra cứu vũ khí, trang bị, vật phẩm, đặc công</small></h3>
      </div>
      <button class="btn btn-sm btn-ghost" id="openWiki" title="Mở Official Wiki">Wiki ↗</button>
    </div>

    <div class="tabs" id="tabs"></div>

    <div class="panel toolbar">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input class="input" id="searchInput" type="search" placeholder="Tìm theo tên..." autocomplete="off">
      </div>
      <div class="chips" id="subChips"></div>
    </div>

    <div class="info"><span id="count"></span><span>Bấm để xem chi tiết</span></div>
    <div class="grid" id="grid"></div>
    <div class="more-wrap"><button class="btn hidden" id="moreBtn">Hiển thị thêm</button></div>

    <p class="source-note">
      Nguồn dữ liệu, hình ảnh và mô tả: <a href="https://www.playdeltaforce.com/events/officialwiki/vi/#/home" target="_blank" rel="noopener">Delta Force Official Wiki</a> (playdeltaforce.com). Bản quyền thuộc nhà phát hành.
    </p>
  </div>

  <div class="modal-overlay" id="detail" hidden>
    <div class="modal-content" role="dialog" aria-modal="true" id="detailBody"></div>
  </div>

  <script src="../../core/shell.js"></script>
  <script src="../../core/garena.js"></script>
  <script src="script.js"></script>
</body>

</html>
