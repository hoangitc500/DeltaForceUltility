<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giá chợ đấu giá - Delta Force Utility</title>
  <link rel="stylesheet" href="../../core/theme.css">
  <script src="../../core/theme.js"></script>
  <style>
    .toolbar { display: flex; flex-direction: column; gap: 8px; padding: 10px; margin-bottom: 10px; }
    .search-row { display: flex; gap: 8px; }
    .search-row .search-wrap { position: relative; flex: 1; }
    .search-wrap svg { position: absolute; left: 10px; top: 50%; width: 15px; height: 15px; transform: translateY(-50%); color: var(--text-faint); pointer-events: none; }
    .search-wrap .input { padding-left: 32px; }
    select.input { width: auto; flex: none; padding-right: 8px; cursor: pointer; }
    .chips .chip small { margin-left: 4px; opacity: 0.6; font-weight: 500; }

    .meta-row { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 8px; font-size: 12px; color: var(--text-faint); }

    .mk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
    .mk-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      text-align: left;
      transition: border-color 0.15s, background 0.15s;
      animation: viewIn 0.2s ease;
    }
    .mk-item:hover { border-color: color-mix(in srgb, var(--primary) 55%, transparent); background: var(--surface-hover); }
    .mk-thumb { flex: none; width: 48px; height: 48px; padding: 3px; object-fit: contain; background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; }
    .mk-body { flex: 1; min-width: 0; }
    .mk-name { font-weight: 600; font-size: 13px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .mk-price { display: flex; align-items: center; gap: 4px; margin-top: 2px; font-weight: 700; color: var(--warning); font-variant-numeric: tabular-nums; }
    .coin { width: 11px; height: 11px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ffe082, #f9a825); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.2); }
    .mk-stock { font-size: 11px; color: var(--text-faint); }

    .list-footer { display: flex; justify-content: center; padding: 12px 0 0; }
    .state-box { grid-column: 1 / -1; padding: 36px 12px; text-align: center; color: var(--text-dim); }
    .skeleton { height: 66px; border-radius: var(--radius); border: 1px solid var(--border); background: linear-gradient(90deg, var(--surface-2) 25%, var(--surface) 50%, var(--surface-2) 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
    @keyframes shimmer { to { background-position: -200% 0; } }
  </style>
</head>

<body>
  <div class="view-container">
    <div class="view-header">
      <div class="title-group">
        <button class="back-btn" data-back></button>
        <h3 class="view-title">Giá chợ đấu giá<small>Giá thấp nhất đang rao · chỉ để tham khảo</small></h3>
      </div>
      <button class="btn btn-sm btn-ghost" id="openSource" title="Mở trang này trên DFLoadout.gg">DFLoadout ↗</button>
    </div>

    <div class="panel toolbar">
      <div class="search-row">
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input class="input" id="searchInput" type="search" maxlength="64" placeholder="Tìm vật phẩm... (VD: giáp, ống ngắm)" autocomplete="off">
        </div>
        <select class="input" id="sortSelect" aria-label="Sắp xếp">
          <option value="">Giá thấp → cao</option>
          <option value="price-desc">Giá cao → thấp</option>
          <option value="listed-desc">Nhiều hàng nhất</option>
          <option value="name">Tên A → Z</option>
        </select>
      </div>
      <div class="chips" id="catChips"></div>
      <div class="chips hidden" id="subChips"></div>
    </div>

    <div class="meta-row"><span id="meta"></span><span>Bấm vật phẩm để xem lịch sử giá</span></div>
    <div class="mk-grid" id="grid"></div>
    <div class="list-footer"><button class="btn hidden" id="loadMoreBtn">Tải thêm</button></div>

    <p class="source-note">
      Nguồn dữ liệu giá và icon vật phẩm: <a href="https://dfloadout.gg/cho-dau-gia" target="_blank" rel="noopener">DFLoadout.gg · Chợ đấu giá</a> (cập nhật mỗi giờ, chỉ xem, không mua bán).
    </p>
  </div>

  <script src="../../core/shell.js"></script>
  <script src="../../core/dfloadout.js"></script>
  <script src="script.js"></script>
</body>

</html>
